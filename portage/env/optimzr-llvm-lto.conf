# Build LLVM/clang with clang itself: -O3, ThinLTO, lld. Measured in docs/toolchain.md.
CC="clang"
CXX="clang++"
AR="llvm-ar"
NM="llvm-nm"
RANLIB="llvm-ranlib"
COMMON_FLAGS="-march=native -O3 -pipe -flto=thin"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
LDFLAGS="${LDFLAGS} -fuse-ld=lld -flto=thin -Wl,--thinlto-jobs=16"
# ThinLTO links are memory hungry; 32 GB is fine at this level
MAKEOPTS="-j16 -l32"
NINJAOPTS="-j16 -l32"
